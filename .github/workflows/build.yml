name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional release tag matching pubspec.yaml (e.g. v1.0.15); leave blank for artifacts only'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Android binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Read and validate version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.version }}
          PUSHED_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          test -n "$version"
          RELEASE_TAG="${PUSHED_TAG:-$REQUESTED_TAG}"
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must match pubspec.yaml: v$version" >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Run regression tests
        run: flutter test tests

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 secret}"
          : "${STORE_PASSWORD:?Missing STORE_PASSWORD secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS secret}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build and collect Android binaries
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          flutter build apk --release --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk "dist/water-sort-v$VERSION.apk"
          flutter build apk --release --no-pub --split-per-abi
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/water-sort-v$VERSION-$abi.apk"
          done
          flutter build appbundle --release --no-pub
          cp build/app/outputs/bundle/release/app-release.aab "dist/water-sort-v$VERSION.aab"
          flutter build apk --release --no-pub --android-project-arg=testBuild=true
          cp build/app/outputs/flutter-apk/app-release.apk "dist/water-sort-test-v$VERSION.apk"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: water-sort-v${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

  release:
    name: Publish requested release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: water-sort-v${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Water Sort ${{ needs.build.outputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
